version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trace_db
      POSTGRES_USER: trace_user
      POSTGRES_PASSWORD: trace_pass
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/tracepass
    ports:
      - "7474:7474"
      - "7687:7687"
